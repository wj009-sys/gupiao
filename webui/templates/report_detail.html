{% extends "base.html" %}
{% block title %}报告详情 — {{ path }}{% endblock %}

{% block content %}
<nav aria-label="breadcrumb" class="mb-3">
    <ol class="breadcrumb" style="background:transparent;padding:0;">
        <li class="breadcrumb-item"><a href="/reports">报告浏览</a></li>
        <li class="breadcrumb-item active" style="color:#8899aa;">{{ path.split('/')[-1] }}</li>
    </ol>
</nav>

<div class="mb-3 d-flex justify-content-between align-items-center">
    <h5 style="color:#c8d6e5;margin:0;">
        <i class="bi bi-file-earmark-text me-2" style="color:#4fc3f7;"></i>{{ path.split('/')[-1] }}
    </h5>
    <div>
        <a href="/reports?date={{ path.split('_')[-1].replace('.md','') }}" class="btn btn-sm btn-outline-secondary me-1">
            <i class="bi bi-calendar"></i> 同日期
        </a>
        <button class="btn btn-sm btn-outline-info" onclick="toggleRaw()">
            <i class="bi bi-code-slash"></i> 原始Markdown
        </button>
    </div>
</div>

<div class="card">
    <div class="card-body report-content" id="reportContent">
        {{ content|safe }}
    </div>
</div>

<!-- Raw Markdown (hidden) -->
<div class="card mt-3" id="rawContent" style="display:none;">
    <div class="card-header">
        <i class="bi bi-code-slash me-1"></i>原始 Markdown
        <button class="btn btn-sm btn-outline-secondary float-end" onclick="copyRaw()">
            <i class="bi bi-clipboard"></i> 复制
        </button>
    </div>
    <div class="card-body">
        <pre style="background:#0a0e17;padding:1rem;border-radius:8px;max-height:600px;overflow-y:auto;font-size:0.8rem;">{{ raw }}</pre>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function toggleRaw() {
    const el = document.getElementById('rawContent');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function copyRaw() {
    const text = {{ raw|tojson }};
    navigator.clipboard.writeText(text).then(() => {
        showToast('已复制到剪贴板', 'info');
    });
}
</script>
{% endblock %}
