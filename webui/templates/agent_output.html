{% extends "base.html" %}
{% block title %}Agent 输出 — {{ agent_key }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 style="color:#c8d6e5;margin:0;">
        <i class="bi bi-terminal me-2" style="color:#4fc3f7;"></i>
        Agent 输出 — {{ agent_key }}
    </h5>
    <div>
        <span id="live-status">
            <span class="ping-dot {{ status.status }}"></span>
            <span class="text-{% if status.status=='running' %}warning{% elif status.status=='success' %}success{% elif status.status=='failed' %}danger{% else %}secondary{% endif %}">
                {{ status.status }}
            </span>
        </span>
        <button class="btn btn-sm btn-outline-info ms-2" onclick="refreshOutput()">
            <i class="bi bi-arrow-clockwise"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary ms-1" onclick="window.close()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="agent-output" id="outputContent">
            {{ status.output or '等待输出...' }}
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let pollTimer = null;

function refreshOutput() {
    fetch(`/agents/output/${agent_key}`)
    .then(r => r.text())
    .then(html => {
        document.getElementById('outputContent').innerHTML = html;
        const el = document.getElementById('outputContent');
        el.scrollTop = el.scrollHeight;
    });
}

// 自动轮询
{% if status.status == 'running' %}
pollTimer = setInterval(refreshOutput, 2000);
setTimeout(() => { if(pollTimer) clearInterval(pollTimer); }, 300000);
{% endif %}
</script>
{% endblock %}
