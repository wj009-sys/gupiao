<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}股票投研管理界面{% endblock %} — Darwin 9.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.12/dist/htmx.min.js"></script>
    <style>
        :root {
            --sidebar-width: 240px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
            background: #0a0e17;
            min-height: 100vh;
        }
        .wrapper { display: flex; }
        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: linear-gradient(180deg, #0d1321 0%, #1a1f2e 100%);
            border-right: 1px solid #2a3040;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            overflow-y: auto;
        }
        .sidebar .brand {
            padding: 1.2rem 1rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #4fc3f7;
            border-bottom: 1px solid #2a3040;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sidebar .nav-link {
            color: #8899aa;
            padding: 0.7rem 1.2rem;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .sidebar .nav-link:hover {
            color: #c8d6e5;
            background: rgba(79, 195, 247, 0.05);
        }
        .sidebar .nav-link.active {
            color: #4fc3f7;
            background: rgba(79, 195, 247, 0.1);
            border-left-color: #4fc3f7;
        }
        .sidebar .nav-link i { font-size: 1.1rem; width: 1.4rem; text-align: center; }
        .sidebar .nav-section {
            padding: 0.6rem 1.2rem 0.3rem;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #556677;
        }
        .main-content {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 2rem;
            min-height: 100vh;
        }
        .card {
            background: #151d2b;
            border: 1px solid #2a3040;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .card-header {
            background: rgba(79, 195, 247, 0.05);
            border-bottom: 1px solid #2a3040;
            color: #c8d6e5;
            font-weight: 600;
            padding: 0.9rem 1.2rem;
        }
        .card-body { padding: 1.5rem; }
        .stat-value { font-size: 1.8rem; font-weight: 700; color: #4fc3f7; }
        .stat-label { font-size: 0.8rem; color: #8899aa; }
        .status-badge { font-size: 0.75rem; padding: 0.25rem 0.6rem; border-radius: 20px; }
        .table { color: #c8d6e5; font-size: 0.9rem; }
        .table th { color: #8899aa; font-weight: 600; border-color: #2a3040; }
        .table td { border-color: #2a3040; vertical-align: middle; }
        .table-hover tbody tr:hover { background: rgba(79, 195, 247, 0.03); }
        a { color: #4fc3f7; text-decoration: none; }
        a:hover { color: #81d4fa; }
        .btn-primary { background: #4fc3f7; border-color: #4fc3f7; color: #0a0e17; font-weight: 600; }
        .btn-primary:hover { background: #81d4fa; border-color: #81d4fa; color: #0a0e17; }
        .btn-outline-primary { border-color: #4fc3f7; color: #4fc3f7; }
        .btn-outline-primary:hover { background: #4fc3f7; color: #0a0e17; }
        .form-control, .form-select {
            background: #0d1321;
            border: 1px solid #2a3040;
            color: #c8d6e5;
        }
        .form-control:focus, .form-select:focus {
            background: #0d1321;
            border-color: #4fc3f7;
            color: #c8d6e5;
            box-shadow: 0 0 0 0.2rem rgba(79, 195, 247, 0.15);
        }
        .report-content h1 { color: #4fc3f7; font-size: 1.6rem; margin-top: 1.5rem; }
        .report-content h2 { color: #81d4fa; font-size: 1.3rem; margin-top: 1.2rem; }
        .report-content h3 { color: #b3e5fc; font-size: 1.1rem; }
        .report-content pre {
            background: #0a0e17;
            border: 1px solid #2a3040;
            border-radius: 8px;
            padding: 1rem;
        }
        .report-content code { color: #ef9a9a; }
        .report-content table { width: 100%; margin: 1rem 0; }
        .report-content th { background: rgba(79, 195, 247, 0.08); }
        .report-content blockquote {
            border-left: 3px solid #4fc3f7;
            padding-left: 1rem;
            color: #8899aa;
        }
        .toast-container { z-index: 9999; }
        .htmx-indicator { opacity: 0; transition: opacity 0.3s; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
        .ping-dot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; margin-right: 6px;
        }
        .ping-dot.running { background: #ffc107; animation: ping 1.5s infinite; }
        .ping-dot.success { background: #4caf50; }
        .ping-dot.failed { background: #f44336; }
        .ping-dot.idle { background: #555; }
        @keyframes ping {
            0% { box-shadow: 0 0 0 0 rgba(255,193,7,0.7); }
            70% { box-shadow: 0 0 0 6px rgba(255,193,7,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,193,7,0); }
        }
        .agent-output {
            background: #0a0e17;
            border: 1px solid #2a3040;
            border-radius: 8px;
            padding: 1rem;
            font-family: "Cascadia Code", "Fira Code", monospace;
            font-size: 0.8rem;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            color: #aabbcc;
        }
        .ask-result {
            background: #0a0e17;
            border: 1px solid #2a3040;
            border-radius: 8px;
            padding: 1.5rem;
            max-height: 600px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0d1321; }
        ::-webkit-scrollbar-thumb { background: #2a3040; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3a4050; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="wrapper">
        <!-- 侧边栏 -->
        <nav class="sidebar">
            <div class="brand">
                <i class="bi bi-graph-up-arrow"></i>
                <span>股票投研</span>
                <span class="badge bg-info ms-1" style="font-size:0.6rem;">v9</span>
            </div>
            <div class="nav-section">导航</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/dashboard">
                        <i class="bi bi-speedometer2"></i> 仪表盘
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'reports' %}active{% endif %}" href="/reports">
                        <i class="bi bi-file-text"></i> 报告浏览
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'agents' %}active{% endif %}" href="/agents">
                        <i class="bi bi-cpu"></i> Agent控制
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'ask' %}active{% endif %}" href="/ask">
                        <i class="bi bi-question-circle"></i> 策略问股
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if page == 'config' %}active{% endif %}" href="/config">
                        <i class="bi bi-gear"></i> 配置管理
                    </a>
                </li>
            </ul>
            <div class="nav-section mt-3">系统</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" href="/health" target="_blank">
                        <i class="bi bi-heart-pulse"></i> 健康检查
                    </a>
                </li>
            </ul>
            <div style="position:absolute;bottom:10px;left:0;right:0;text-align:center;padding:0.5rem;font-size:0.7rem;color:#445566;">
                Darwin 9.0 · 7 Agent
            </div>
        </nav>

        <!-- 主内容 -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Toast容器 -->
    <div class="toast-container position-fixed top-0 end-0 p-3" id="toastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script>
        // Toast 通知
        function showToast(message, type='success') {
            const container = document.getElementById('toastContainer');
            const colors = {success: '#4caf50', danger: '#f44336', warning: '#ff9800', info: '#4fc3f7'};
            const icons = {success: 'bi-check-circle-fill', danger: 'bi-x-circle-fill', warning: 'bi-exclamation-triangle-fill', info: 'bi-info-circle-fill'};
            const toast = document.createElement('div');
            toast.className = 'toast align-items-center text-bg-dark border-0 show';
            toast.style.background = '#1a1f2e';
            toast.style.border = `1px solid ${colors[type] || '#4fc3f7'}`;
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi ${icons[type] || 'bi-info-circle-fill'}" style="color:${colors[type] || '#4fc3f7'}"></i>
                        ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }
        // HTMX 错误处理
        document.addEventListener('htmx:responseError', function(evt) {
            showToast(`请求失败: ${evt.detail.status}`, 'danger');
        });
        document.addEventListener('htmx:beforeRequest', function(evt) {
            const btn = evt.detail.elt;
            if (btn && btn.tagName === 'BUTTON') btn.disabled = true;
        });
        document.addEventListener('htmx:afterRequest', function(evt) {
            const btn = evt.detail.elt;
            if (btn && btn.tagName === 'BUTTON') btn.disabled = false;
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
